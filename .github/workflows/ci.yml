name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'renovate.json'
      - '.editorconfig'
      - '.gitignore'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'renovate.json'
      - '.editorconfig'
      - '.gitignore'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'
  workflow_dispatch:

jobs:
  commit-message:
    name: Check Commit Message
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Commit Message [skip CI]
        env:
          COMMIT_FILTER: "[skip ci]"
        if: "contains(github.event.head_commit.message, '[skip ci]')"
        run: |
          echo "no 'skip ci' in commit message"
          exit 2

      - uses: actions-ecosystem/action-regex-match@v2
        id: regex-match
        with:
          text: ${{ github.event.head_commit.message }}
          regex: '[^\x00-\x7F]+'

      - name: Check Commit Message [Non-ASCII]
        if: ${{ steps.regex-match.outputs.match != '' }}
        run: |
          echo "No Non-ASCII msg in commit message"
          exit 2

  unit-test:
    name: Unit Test (JVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          fetch-depth: 1

      - name: Config submodules
        run: |
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsprism.update" none
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsparself.update" none
          git -C "libs/LSPlant" config "submodule.docs/doxygen-awesome-css.update" none
          git -C "libs/mmkv/MMKV" config "submodule.Python/pybind11.update" none
          git submodule foreach git submodule update --init --recursive

      - name: set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          mkdir -p "$ANDROID_HOME/licenses/"
          echo > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -n 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-test-output.log

      - name: Surface test failures as annotations
        if: failure()
        run: |
          # gradle test failures live in XML reports; mirror them into the
          # check-run annotations so they are visible via the REST API.
          # when gradle failed without test results, chunk the build log
          # tail into annotations as well (location-less errors have no
          # native annotations).
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          found = False
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      found = True
                      print('::error title=Test failed::{}.{}'.format(
                          tc.get('classname'), tc.get('name')))
                      node = tc.find('failure')
                      if node is None:
                          node = tc.find('error')
                      msg = (node.get('message') or '').replace('\n', ' ')[:300]
                      print('::error title=Detail::{}'.format(msg))
          if not found:
              print('::error title=No test XML found::gradle failed before/without test results')
              try:
                  lines = open('gradle-test-output.log', errors='replace').read().splitlines()
              except OSError:
                  lines = []
              import re
              # priority: compiler/tool error lines; never pure stack frames
              hits = [l for l in lines if re.search(
                  r'e: file:|error:|FAILED|What went wrong|Unresolved|cannot find|Caused by', l)]
              if not hits:
                  hits = [l for l in lines[-400:] if l.strip() and not l.lstrip().startswith('at ')]
              for i, l in enumerate(hits[-40:]):
                  print('::error title=Build error {}::{}'.format(i + 1, l[:700]))
          PY
          echo '---- raw failure snippets ----'
          grep -rA6 -E '<failure|<error' app/build/test-results/testDebugUnitTest 2>/dev/null | head -80 || true

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore

  build:
    name: Build Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Config submodules
        run: |
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsprism.update" none
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsparself.update" none
          git -C "libs/LSPlant" config "submodule.docs/doxygen-awesome-css.update" none
          git -C "libs/mmkv/MMKV" config "submodule.Python/pybind11.update" none
          git submodule foreach git submodule update --init --recursive

      - name: set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install ccache
        run: |
          sudo apt install -y ccache ninja-build
          ccache -o max_size=1G
          ccache -o hash_dir=false
          ccache -o hard_link=true
          ccache -o compiler_check='%compiler% -dumpmachine; %compiler% -dumpversion'
          ccache -zp

      - name: Cache Native Build
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
            app/build/.lto-cache
          key: native-cache-${{ github.sha }}
          restore-keys: native-cache-

      - name: Setup SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_HOME/licenses/"
          echo > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -n 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          echo 'qauxv.override.ninja.path=/usr/bin/ninja' >> local.properties
          set -o pipefail
          ./gradlew :app:packageDebug --stacktrace 2>&1 | tee gradle-build-output.log
          ccache -s
        env:
          QAUXV_OVERRIDE_CMAKE_VERSION: "3.31.0"

      - name: Surface build failures as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lines = open('gradle-build-output.log', errors='replace').read().splitlines()
          # context windows around every strong failure signal (JVM + native),
          # so the cause lines following a FAILED/CMake Error header are kept
          strong = [i for i, l in enumerate(lines) if re.search(
              r'e: file:|error:|FAILED|What went wrong|Caused by|CMake Error|ninja: build stopped', l)]
          seen = set()
          picked = []
          for i in strong:
              for j in range(max(0, i - 3), min(len(lines), i + 9)):
                  if j not in seen:
                      seen.add(j)
                      picked.append(j)
          picked.sort()
          count = 0
          for j in picked:
              l = lines[j]
              if l.strip() and not l.lstrip().startswith('at '):
                  count += 1
                  if count > 80:
                      break
                  print('::error title=Build error line {}::{}'.format(j + 1, l[:700]))
          if count == 0:
              for l in lines[-60:]:
                  if l.strip() and not l.lstrip().startswith('at '):
                      print('::error title=Build tail::{}'.format(l[:700]))
          PY

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
