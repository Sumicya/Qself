name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compare_run:
        description: '可选：对比该 run 的原始 debug APK 字节数'
        required: false
        type: string

# PR 构建不应持有写令牌或发布签名；仅允许读取已有构建产物。
permissions:
  contents: read
  actions: read

jobs:
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 拼出并校验 QQ 9.2.10 真包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          git -C qq rev-parse HEAD
          cat qq/qq.a* > qq.apk && rm -rf qq
          echo '34bdea66e738062c3f762f7da98132addc7170394605a4f5ca1944bee1280c84  qq.apk' | sha256sum -c -
      - name: 逐个核对模块的 QQ 挂点（不等于模块检测审计）
        run: |
          python3 tools/test_dexq.py
          python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build (untrusted debug key)
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check libxposed packaging
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-test-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Compare APK bytes (optional manual run)
        id: size
        if: github.event_name == 'workflow_dispatch' && inputs.compare_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_RUN: ${{ inputs.compare_run }}
        run: |
          set -euo pipefail
          old_name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPARE_RUN/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("Qself-test-debug-")) | .name' | head -n 1)
          test -n "$old_name"
          mkdir -p "$RUNNER_TEMP/previous"
          gh run download "$COMPARE_RUN" --repo "$GITHUB_REPOSITORY" --name "$old_name" --dir "$RUNNER_TEMP/previous"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          old, = Path(os.environ['RUNNER_TEMP'], 'previous').glob('*.apk')
          new = Path('app/build/outputs/apk/debug/app-debug.apk')
          report = []
          a, b = old.stat().st_size, new.stat().st_size
          report.append(f'原始 APK 字节：{a} -> {b}；差值 {b-a:+d}')
          for label, pick in [
              ('DEX', lambda n: n.startswith('classes') and n.endswith('.dex')),
              ('resources.arsc', lambda n: n == 'resources.arsc'),
              ('res/', lambda n: n.startswith('res/')),
          ]:
              values = []
              for apk in (old, new):
                  with ZipFile(apk) as z:
                      infos = [f for f in z.infolist() if pick(f.filename)]
                      values.append((sum(f.compress_size for f in infos), sum(f.file_size for f in infos)))
              report.append(f'{label}（APK 压缩字节/解压字节）：{values[0]} -> {values[1]}')
          result = '\n'.join(report) + '\n'
          print(result)
          Path(os.environ['RUNNER_TEMP'], 'qself-apk-size.txt').write_text(result)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'old_bytes={a}\nnew_bytes={b}\n')
          PY
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.compare_run != '' && steps.size.outcome == 'success'
        with:
          name: Qself-APK-bytes-${{ steps.size.outputs.old_bytes }}-to-${{ steps.size.outputs.new_bytes }}
          path: ${{ runner.temp }}/qself-apk-size.txt
          if-no-files-found: error

  # 私钥不交给 PR、普通 push 或仓库文件；维护者配好 secrets 后从 main 手动发布。
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Load maintainer signing key
        env:
          KEYSTORE_B64: ${{ secrets.QSELF_KEYSTORE_B64 }}
          QSELF_SIGNING_PASSWORD: ${{ secrets.QSELF_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$QSELF_SIGNING_PASSWORD" ]]; then
            echo 'Configure QSELF_KEYSTORE_B64 and QSELF_SIGNING_PASSWORD first (see README).' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qself.p12"
          echo "QSELF_SIGNING_STORE=$RUNNER_TEMP/qself.p12" >> "$GITHUB_ENV"
      - name: Test and build signed release
        env:
          QSELF_SIGNING_PASSWORD: ${{ secrets.QSELF_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify release signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove private key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/qself.p12"
