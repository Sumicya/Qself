# Qself CI。每次 push 两个作业：dex 拿真 QQ 包核每一个落点；apk 跑 ProtoTest 再出 debug APK 挂进 Artifacts
# （不发 release：包从 Actions 里最近一次成功的 run 取），失败时把 Gradle 日志尾巴贴成提交评论。
# 版本只在这里算一次：提交时间（Asia/Shanghai）.本工作流 run 号 → QSELF_VERSION，Gradle 和产物名都读它。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 只为失败时那条提交评论

jobs:
  # 落点核对：真包在 Sumicya/qqapk（qq.aa..qq.ae 拼起来）。表红了就是这版 QQ 里名字对不上，
  # 出包也是白出 —— 所以这个作业和出包平行跑，谁红都拦得住。
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 拼出真 QQ 包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          cat qq/qq.a* > qq.apk && rm -rf qq
          ls -l qq.apk
      - name: 逐个核落点
        run: python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 版本号：提交日（Asia/Shanghai）.run 号；重试、跨日重试不变
        run: echo "QSELF_VERSION=$(TZ=Asia/Shanghai date -d "@$(git show -s --format=%ct HEAD)" +%y.%-m.%-d).$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Check libxposed packaging
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      # 产物名与版本同源：Artifacts 里是 Qself-<版本>，里面是 qself-<版本>.apk（版本来自上面那一步）。
      - name: 按版本给 APK 改名
        run: |
          APK=app/build/outputs/apk/debug
          mv "$APK/app-debug.apk" "$APK/qself-$QSELF_VERSION.apk"
          ls -l "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ env.QSELF_VERSION }}
          path: app/build/outputs/apk/debug/qself-*.apk
          if-no-files-found: error
      - name: Publish the build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "failed before gradle" > build.log
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(tail -c 6000 build.log)"
