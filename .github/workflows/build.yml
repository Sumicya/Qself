# Qself CI。
#
# push / PR / 手动运行：dex 作业拿真 QQ 包核每一个落点；apk 作业按五段版本出 debug APK 放进 Artifacts。
# 出包后立刻做数量清理，分两个作业：artifact（5 个）与运行记录（5 条）用最小 actions: write，
# 任何分支与同仓 PR 都跑；Release（1 个）/ tag 收口要 contents: write，只在默认分支跑。两者分开授权，不同授。
# 版本取数只锚定本次 run：总序号 = run_number − 35（基线见下方注释），
# 当日序号 = 本次 run 的 head 提交在当日（UTC+8）提交序列中的位次；禁止查最新 run / 最新 artifact。
# 删除历史运行记录不影响这两个数。旧锚（历史成功数、现存 artifact 最大号）已停用。
# CI 不创建 Release、正式发行 tag 或 Release asset；正式发版必须由主人明确授权并人工完成。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # 落点核对：真包在 Sumicya/qqapk（qq.aa..qq.ae 拼起来）。表红了就是这版 QQ 里名字对不上，
  # 出包也是白出 —— 所以这个作业和出包平行跑，谁红都拦得住。
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 拼出真 QQ 包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          cat qq/qq.a* > qq.apk && rm -rf qq
          ls -l qq.apk
      - name: 逐个核落点
        run: python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # 当日序号要数「head 提交在当日提交序列中的位次」，得拿全量历史。
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6

      # 同一个 run 重试时不许重新加号：第一次 attempt 把版本号存进缓存，重试取回。
      - name: 取回第一次 attempt 的版本号
        if: github.run_attempt > 1
        uses: actions/cache/restore@v6
        with:
          path: version.txt
          key: qself-version-${{ github.run_id }}

      - name: 算五段版本 yy.m.d.当日序号.总序号
        env:
          GH_TOKEN: ${{ github.token }}
          # 基线 35 = run_number 253（26.10.13 第 7 次运行，出的是 26.10.13.7.218）− 218。
          # 号只增不减：失败运行与 PR 运行也占号，跳号是正常的。
          TOTAL_BASE: '35'
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if [ -f version.txt ]; then
            version="$(cat version.txt)"
            echo "复用第一次 attempt 的版本：$version"
          else
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
              echo "重试却取不到第一次 attempt 的版本号：那次在算出版本前就失败了。按口径不重新加号，请新开一次运行。" >&2
              exit 1
            fi
            # 只锚定本次 run 自身：created_at、run_number，不查最新 run。
            created="$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
            my_num="$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID" --jq '.run_number')"
            day="$(TZ=Asia/Shanghai date -d "$created" +%y.%-m.%-d)"
            local_day="$(TZ=Asia/Shanghai date -d "$created" +%Y-%m-%d)"
            # 当日序号 = head 提交在当日（UTC+8）提交序列中的位次 = 从 HEAD 可达、提交日在当日的提交数。
            head_day="$(TZ=Asia/Shanghai date -d "$(git log -1 --format=%cI HEAD)" +%Y-%m-%d)"
            if [ "$head_day" != "$local_day" ]; then
              echo "head 提交不在当日（head=$head_day，当日=$local_day），拒绝出号" >&2; exit 1
            fi
            daily="$(git rev-list --count --since="$local_day 00:00:00 +0800" HEAD)"
            if [ -z "$daily" ] || [ "$daily" -lt 1 ]; then
              echo "当日序号取不到（head 提交不在当日提交序列里），拒绝出号" >&2; exit 1
            fi
            total="$((my_num - TOTAL_BASE))"
            if [ "$total" -lt 1 ]; then echo "总序号 $total 不合法，拒绝出号" >&2; exit 1; fi
            version="$day.$daily.$total"
            printf '%s' "$version" > version.txt
          fi
          printf '%s' "$version" | grep -Eq '^[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$' \
            || { echo "版本不是五段格式：$version" >&2; exit 1; }
          echo "QSELF_VERSION=$version" >> "$GITHUB_ENV"

      - name: 存住版本号（供同 run 重试复用）
        if: github.run_attempt == 1
        uses: actions/cache/save@v6
        with:
          path: version.txt
          key: qself-version-${{ github.run_id }}

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Check libxposed packaging
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name 'Qself-*.apk' -print -quit)
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ env.QSELF_VERSION }}
          path: app/build/outputs/apk/debug/Qself-${{ env.QSELF_VERSION }}.apk
          if-no-files-found: error
          # 只有同一个 run 的重试会遇到同名（版本号相同）；换个运行就是另一卷，盖不到别的产物。
          overwrite: true
          retention-days: 5

  # artifact（5 个）与运行记录（5 条）的数量清理：本 run 上传成功后立刻跑。计数跨分支、跨事件，
  # 所以任何分支的 push、同仓 PR 都要收口。权限只给最小 actions: write（只删本项目 artifact 与 run），
  # 按规范不与 contents: write 同授；动不到 Release、tag、分支。
  cleanup-artifacts:
    needs: apk
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: qself-cleanup-artifacts
      cancel-in-progress: false
    permissions:
      actions: write
    steps:
      - name: 项目 artifact 只留最近 5 个
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime

          REPO = os.environ["REPO"]
          WORKFLOW = ".github/workflows/build.yml"  # 本项目的出包工作流
          PREFIX = "Qself-"                        # 命名前缀只作初筛，归属看 run 记录
          KEEP = 5

          def gh(*args, check=True):
              p = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and p.returncode != 0:
                  raise SystemExit("gh " + " ".join(args) + " 失败：" + p.stderr.strip())
              return p.stdout

          def list_all(url, key):
              # 完整分页，逐条 JSON
              out = gh("api", "--paginate", url, "--jq", key + "[]")
              return [json.loads(line) for line in out.splitlines() if line.strip()]

          def at(obj):
              return datetime.fromisoformat(obj["created_at"].replace("Z", "+00:00"))

          arts = [a for a in list_all(f"repos/{REPO}/actions/artifacts?per_page=100", ".artifacts") if not a["expired"]]
          runs = {}

          def mine(a):
              # 归属核验：名字前缀初筛 + 出包工作流 + 属于本仓库的 run
              rid = a["workflow_run"]["id"]
              if rid not in runs:
                  runs[rid] = json.loads(gh("api", f"repos/{REPO}/actions/runs/{rid}"))
              r = runs[rid]
              return (a["name"].startswith(PREFIX)
                      and r.get("path") == WORKFLOW
                      and r.get("repository", {}).get("full_name") == REPO)

          own = sorted([a for a in arts if mine(a)], key=at, reverse=True)
          keep, drop = own[:KEEP], own[KEEP:]
          print("artifact 保留清单：")
          for a in keep:
              print(f"  {a['created_at']}  {a['name']}  id={a['id']}")
          print("artifact 删除清单：")
          for a in drop:
              print(f"  {a['created_at']}  {a['name']}  id={a['id']}")
          for a in drop:
              gh("api", "-X", "DELETE", f"repos/{REPO}/actions/artifacts/{a['id']}")
              print(f"已删 artifact {a['id']} {a['name']}")

          print(f"本项目 artifact 共 {len(own)} 个，保留 {len(keep)} 个；不在范围内（归属不明或非本项目）{len(arts) - len(own)} 个")
          PY

      - name: 运行记录只留最近 5 条
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from collections import Counter

          REPO = os.environ["REPO"]
          KEEP_RECENT = 5
          SELF = int(os.environ["SELF"])

          def gh(*args, check=True):
              p = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and p.returncode != 0:
                  raise SystemExit("gh " + " ".join(args) + " 失败：" + p.stderr.strip())
              return p.stdout

          def list_all(url, key):
              out = gh("api", "--paginate", url, "--jq", key + "[]")
              return [json.loads(line) for line in out.splitlines() if line.strip()]

          # 只按创建先后（run id 单调）留最近 5 条；版本取数不依赖任何历史锚点，锚点不再保留。
          runs = list_all(f"repos/{REPO}/actions/runs?per_page=100", ".workflow_runs")
          keep = {r["id"] for r in sorted(runs, key=lambda r: r["id"], reverse=True)[:KEEP_RECENT]}
          keep.add(SELF)
          drop = [r for r in runs if r["id"] not in keep and r["status"] == "completed"]
          print("运行记录保留清单：")
          for r in sorted([r for r in runs if r["id"] in keep], key=lambda r: r["id"], reverse=True):
              print(f"  id={r['id']} {r['created_at']} {r['path']} {r['status']}")
          print(f"运行记录删除清单：{len(drop)} 条")
          for path, n in Counter(r["path"] for r in drop).most_common():
              print(f"  {path}  {n} 条")
          n = 0
          for r in drop:
              gh("api", "-X", "DELETE", f"repos/{REPO}/actions/runs/{r['id']}")
              n += 1
              if n % 50 == 0:
                  print(f"进度：已删 {n}/{len(drop)}")
          print(f"已删运行记录 {n} 条；剩余 {len(runs) - n} 条")
          PY

  # Release / tag 清理：动的是发行对象，要 contents: write，所以单独作业、只在默认分支上跑，
  # 与上面那个 actions: write 的作业分开授权（规范禁止两者同授）。
  cleanup-releases:
    needs: apk
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: qself-cleanup-releases
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 项目 Release 只留最近 1 个
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime

          REPO = os.environ["REPO"]
          PREFIX = "Qself-"
          KEEP = 1

          def gh(*args, check=True):
              p = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and p.returncode != 0:
                  raise SystemExit("gh " + " ".join(args) + " 失败：" + p.stderr.strip())
              return p.stdout

          def at(obj):
              return datetime.fromisoformat(obj["created_at"].replace("Z", "+00:00"))

          out = gh("api", "--paginate", f"repos/{REPO}/releases?per_page=100", "--jq", ".[]")
          rels = [json.loads(l) for l in out.splitlines() if l.strip()]
          rels = sorted([r for r in rels if r["tag_name"].startswith(PREFIX)], key=at, reverse=True)
          keep, drop = rels[:KEEP], rels[KEEP:]
          kept_tags = {r["tag_name"] for r in keep}
          print("Release 保留清单：", [r["tag_name"] for r in keep] or "（无）")
          print("Release 删除清单：", [r["tag_name"] for r in drop] or "（无）")
          for r in drop:
              gh("api", "-X", "DELETE", f"repos/{REPO}/releases/{r['id']}")
              print(f"已删 Release {r['tag_name']}")
          for r in drop:
              tag = r["tag_name"]
              if tag in kept_tags:
                  continue
              p = subprocess.run(["gh", "api", f"repos/{REPO}/git/ref/tags/{tag}"], capture_output=True, text=True)
              if p.returncode != 0:
                  if "Not Found" in p.stderr:
                      print(f"tag {tag} 已不存在，跳过")
                      continue
                  raise SystemExit(f"查 tag {tag} 失败：{p.stderr.strip()}")
              gh("api", "-X", "DELETE", f"repos/{REPO}/git/ref/tags/{tag}")
              print(f"已删 tag {tag}")
          print(f"本项目 Release 共 {len(rels)} 个，保留 {len(keep)} 个")
          PY
