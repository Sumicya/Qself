# Qself CI。
#
# 每次 push / PR / 手动运行：dex 作业核真实落点，apk 作业测试、出 debug APK；成功后清理 Qself artifact，只保留最近 5 个。
# fork PR 不上传 artifact 也不拿写权限；同仓库 PR、push、手动运行都执行清理。artifact 另设 5 天过期。
# CI 不创建 Release、正式发行 tag 或 Release asset；正式发版必须按仓库规范由主人明确授权并人工完成。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # 落点核对：真包在 Sumicya/qqapk（qq.aa..qq.ae 拼起来）。表红了就是这版 QQ 里名字对不上，
  # 出包也是白出 —— 所以这个作业和出包平行跑，谁红都拦得住。
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 拼出真 QQ 包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          cat qq/qq.a* > qq.apk && rm -rf qq
          ls -l qq.apk
      - name: 逐个核落点
        run: python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Calculate release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
          day="$(TZ=Asia/Shanghai date -d "$stamp" +%y.%-m.%-d)"
          local_day="$(TZ=Asia/Shanghai date -d "$stamp" +%Y-%m-%d)"
          since="$(TZ=Asia/Shanghai date -u -d "$local_day 00:00:00" +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            push_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=push&created=>=$since&per_page=1" --jq '.total_count')"
            dispatch_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=workflow_dispatch&created=>=$since&per_page=1" --jq '.total_count')"
            total_push="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=push&per_page=1" --jq '.total_count')"
            total_dispatch="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=workflow_dispatch&per_page=1" --jq '.total_count')"
            daily="$((push_runs + dispatch_runs))"
            total="$((total_push + total_dispatch))"
          else
            daily=0
            total=0
          fi
          echo "QSELF_DAILY_SEQUENCE=$daily" >> "$GITHUB_ENV"
          echo "QSELF_VERSION=$day.$daily.$total" >> "$GITHUB_ENV"

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Check libxposed packaging
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name 'Qself-*.apk' -print -quit)
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          name: Qself-${{ env.QSELF_VERSION }}
          path: app/build/outputs/apk/debug/Qself-${{ env.QSELF_VERSION }}.apk
          if-no-files-found: error
          retention-days: 5

  cleanup_artifacts:
    name: 清理 Qself 历史 artifact
    # 凡是上传 Qself artifact 的事件都清；fork PR 不上传，所以既不超额也不需要给它写权限。
    needs: apk
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: qself-artifact-retention
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - name: 保留最近 5 个 Qself artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "5"
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          repo = os.environ["REPO"]
          keep = os.environ["KEEP"]
          if not keep.isdecimal() or int(keep) < 1:
              sys.exit("KEEP 必须为正整数")
          keep = int(keep)

          def api(path, method=None):
              cmd = ["gh", "api"]
              if method:
                  cmd += ["-X", method]
              cmd.append(path)
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode:
                  sys.exit(f"gh api {path} 失败: {result.stderr.strip()}")
              return result.stdout

          def all_artifacts():
              rows = []
              page = 1
              while True:
                  data = json.loads(api(f"repos/{repo}/actions/artifacts?per_page=100&page={page}"))
                  batch = data.get("artifacts", [])
                  if not batch:
                      return rows
                  rows.extend(batch)
                  page += 1

          # Qself- 是本工作流唯一使用的产物前缀；名称以外的项目产物绝不进入删除集。
          def owned_artifacts():
              all_rows = all_artifacts()
              owned = [a for a in all_rows if a.get("name", "").casefold().startswith("qself-")]
              owned.sort(key=lambda a: (a["created_at"], int(a["id"])), reverse=True)
              return all_rows, owned

          for attempt in range(1, 11):
              artifacts, owned = owned_artifacts()
              keep_rows, delete_rows = owned[:keep], owned[keep:]
              print(f"第 {attempt} 轮：Qself artifact {len(owned)} 个；保留 {len(keep_rows)} 个；其他 artifact {len(artifacts) - len(owned)} 个不在清理范围。", flush=True)
              print("完整保留/删除清单（以下清单全部输出后才开始删除）：", flush=True)
              for artifact in keep_rows:
                  print(f"KEEP   {artifact['created_at']} {artifact['name']} id={artifact['id']}", flush=True)
              for artifact in delete_rows:
                  print(f"DELETE {artifact['created_at']} {artifact['name']} id={artifact['id']}", flush=True)
              if not delete_rows:
                  print("无待删除 artifact", flush=True)

              for artifact in delete_rows:
                  api(f"repos/{repo}/actions/artifacts/{artifact['id']}", method="DELETE")
                  print(f"DELETED {artifact['created_at']} {artifact['name']} id={artifact['id']}", flush=True)

              remaining = [a for a in all_artifacts() if a.get("name", "").casefold().startswith("qself-")]
              print(f"本轮清理后 Qself artifact: {len(remaining)} 个；目标上限 {keep} 个。", flush=True)
              if len(remaining) <= keep:
                  print("清理完成；未触碰其他 artifact、Release 或 tag。", flush=True)
                  break
          else:
              sys.exit("多轮清理后仍超过上限；检查是否有持续并发上传")
          PY
