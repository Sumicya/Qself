# Qself 出包：push 与手动触发都出 debug APK，产物名 Qself-五段版本。
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: 拼出真 QQ 包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          cat qq/qq.a* > qq.apk && rm -rf qq
          ls -l qq.apk
      - name: 逐个核落点
        run: |
          python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet
          python3 tools/ui_paths.py qq.apk
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Skia CPU 编译五份移植着色器（不是设备验收）
        run: bash tools/check-shaders.sh
      - name: 算版本 yy.m.d.当日序号.总序号
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows/build.yml/runs?per_page=100" > runs.json
          gh api "repos/$REPO/actions/artifacts?per_page=100" > arts.json
          python3 - <<'PY'
          import json, os, re, sys
          from datetime import datetime, timedelta, timezone

          TZ = timezone(timedelta(hours=8))
          repo = os.environ["REPO"]
          run_number = int(os.environ["RUN_NUMBER"])
          runs = json.load(open("runs.json"))["workflow_runs"]
          arts = json.load(open("arts.json"))["artifacts"]

          def local_day(stamp: str) -> str:
              return datetime.fromisoformat(stamp.replace("Z", "+00:00")).astimezone(TZ).strftime("%y.%-m.%-d")

          today = local_day(datetime.now(TZ).isoformat())
          todays = [r["run_number"] for r in runs if local_day(r["run_started_at"]) == today]
          first = min(todays) if todays else run_number

          # 当日现存合规产物 Qself-yy.m.d.d0.r0 反推当日首条运行号 r0 - d0 + 1
          pat = re.compile(r"^" + re.escape(repo.split("/")[-1]) + r"-(\d{2}\.\d{1,2}\.\d{1,2})\.(\d+)\.(\d+)$")
          for a in arts:
              m = pat.match(a["name"])
              if not m or a.get("expired"):
                  continue
              if m.group(1) != today:
                  continue
              first = min(first, int(m.group(3)) - int(m.group(2)) + 1)

          daily = run_number - first + 1
          if daily < 1:
              sys.exit(f"当日序号小于 1：run_number={run_number} R_first={first}")
          version = f"{today}.{daily}.{run_number}"
          if not re.fullmatch(r"\d{2}\.\d{1,2}\.\d{1,2}\.\d+\.\d+", version):
              sys.exit(f"版本不是五段：{version}")
          print(f"取号：HEAD SHA={os.environ.get('GITHUB_SHA', '')} run_id={os.environ['RUN_ID']} "
                f"run_number={run_number} R_first={first} 当日序号={daily} 版本={version}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"QSELF_VERSION={version}\n")
          PY
      - name: 测试与出包
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: 核对模块入口
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name 'Qself-*.apk' -print -quit)
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ env.QSELF_VERSION }}
          path: app/build/outputs/apk/debug/Qself-${{ env.QSELF_VERSION }}.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 5

  cleanup-artifacts:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: qself-cleanup
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 按五条判据清理产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py

  cleanup-releases:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: qself-cleanup
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release 只留最近 1 个，孤立 tag 一并删
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: releases
        run: python3 .github/scripts/cleanup.py
