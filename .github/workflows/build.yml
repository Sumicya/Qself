# Qself CI。dex 作业拿真 QQ 包核每一个落点；apk 作业跑 ProtoTest 再出 debug APK 放进 Artifacts。
# 触发：push / PR / 手动。不做：不发 Release、不打 tag、不写正式 asset。
# 清理：artifact 与运行记录按规范留最新 5 个，独立 job 挂 always，构建红了也照跑。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

concurrency:
  group: qself-build
  cancel-in-progress: false

jobs:
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 拼出真 QQ 包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          cat qq/qq.a* > qq.apk && rm -rf qq
          ls -l qq.apk
      - name: 逐个核落点
        run: python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: 取版本号
        run: |
          day="$(TZ=Asia/Shanghai date +%y.%-m.%-d)"
          echo "QSELF_VERSION=$day.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: 跑单测与出包
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: 核对 xposed 打包
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name 'Qself-*.apk' -print -quit)
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ env.QSELF_VERSION }}
          path: app/build/outputs/apk/debug/Qself-${{ env.QSELF_VERSION }}.apk
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  cleanup-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 按判据清理产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py
