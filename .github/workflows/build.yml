# Qself CI。agent 没有 workflow 权限，这份要由人复制过去：
#
#   cp ci/build.yml .github/workflows/build.yml
#   git add .github/workflows/build.yml && git commit -m "ci: 上 workflow" && git push
#
# 每次 push 两个作业：dex 拿真 QQ 包核每一个落点；apk 跑 ProtoTest 再出 debug APK 放进 Artifacts，
# 失败时把 Gradle 日志尾巴贴成提交评论。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # 落点核对：真包在 Sumicya/qqapk（qq.aa..qq.ae 拼起来）。表红了就是这版 QQ 里名字对不上，
  # 出包也是白出 —— 所以这个作业和出包平行跑，谁红都拦得住。
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 拼出真 QQ 包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          cat qq/qq.a* > qq.apk && rm -rf qq
          ls -l qq.apk
      - name: 逐个核落点
        run: python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Calculate daily build sequence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          SEQ=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --created "$DATE" --limit 1000 --json databaseId --jq 'length')
          echo "QSELF_DAILY_SEQUENCE=$SEQ" >> "$GITHUB_ENV"
          YY=$(TZ=Asia/Shanghai date +%y)
          MM=$(TZ=Asia/Shanghai date +%-m)
          DD=$(TZ=Asia/Shanghai date +%-d)
          echo "QSELF_VERSION=$YY.$MM.$DD.$SEQ.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Check libxposed packaging
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ env.QSELF_VERSION }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('build.log') != ''
        with:
          name: Qself-${{ env.QSELF_VERSION }}-log
          path: build.log
          retention-days: 5
