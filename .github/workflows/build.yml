# Qself CI. This file has to live at .github/workflows/build.yml:
#
#   mkdir -p .github/workflows && cp ci/build.yml .github/workflows/build.yml
#   git add .github/workflows/build.yml && git commit -m "ci: build" && git push
#
# Once it is there, every push builds the APK and uploads it as an artifact.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon :app:assembleDebug
      - name: Check libxposed packaging
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
