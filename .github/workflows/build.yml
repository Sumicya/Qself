# Qself 出包工作流。
#
# 触发只允许 push（不限定分支，会话分支推送同样出包用于验证）与 workflow_dispatch；
# 不得接 pull_request（同一提交被 push 与 pull_request 各出一次包会产出两个同名 artifact，互相覆盖），
# 也不得加 branches 限定或 github.ref 守卫 —— 那等于砍掉验证手段（规范 a8787a8）。
# 号源只有 git 提交数一处（规范 c5ac12d）：总序号 = `git rev-list --count HEAD`，
# 当日序号 = `git rev-list --count --since=<当日0点 UTC+8> HEAD`；run_number、事件类型、工作流文件名、PR 与否一律不进版本号。
# head 提交不在当日（UTC+8）时当日序号取 0（表示重出旧提交的包），不写 1 冒充当日首包。
# `actions/checkout` 必须 `fetch-depth: 0`：浅克隆下提交数恒为 1、所有产物都会叫 `.1.1`。
# 取号脚本启动行打印 head sha、两个数与命令原文；取不到数就失败退出，不留降级、不退化四段。
# 提交数就是号源：禁止空提交与无内容提交，禁止 force push 与 rebase 重写已出包的历史。
# dex 作业拿真 QQ 包核每一个落点；apk 作业按五段版本出 debug APK 放进 Artifacts。
# 清理逻辑只一份 `.github/scripts/cleanup.py`：本工作流 `CLEANUP_APPLY: 'true'` 真删，权限 actions: write；
# PR 校验工作流同一份脚本、同值真删（会话推送即触发），两处挂同一个 concurrency group 串行；
# Release（1 个）/ tag 收口要 contents: write，只在默认分支跑，分开授权不同授。
# 禁止用 run_number、历史成功数、现存 artifact 最大号等旧锚取数。
# CI 不创建 Release、正式发行 tag 与 Release asset；发布只由主人主动发起。
name: Build

on:
  # 不限定分支：会话分支推送同样出包用于验证（规范 a8787a8）；不得加 branches 限定或 github.ref 守卫。
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# 产物命名口径：`Qself-<版本>` 里版本段的段数（五段 = yy.m.d.当日序号.总序号），清理作业按它判口径。
env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'          # 清理脚本的真删开关；PR 校验工作流同一份脚本同值，两处同一 concurrency group 串行

jobs:
  # 落点核对：真包在 Sumicya/qqapk（qq.aa..qq.ae 拼起来）。表红了就是这版 QQ 里名字对不上，
  # 出包也是白出 —— 所以这个作业和出包平行跑，谁红都拦得住。
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 拼出真 QQ 包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          cat qq/qq.a* > qq.apk && rm -rf qq
          ls -l qq.apk
      - name: 逐个核落点
        run: |
          python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet
          python3 tools/ui_paths.py qq.apk
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Skia CPU 编译四份移植着色器（不是设备验收）
        run: bash ci/check-shaders.sh

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # 取号要完整历史：缺 fetch-depth: 0 时 git rev-list --count HEAD 恒为 1，所有产物都会叫 .1.1。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6

      # 号源只有 git 提交数一处（规范 c5ac12d）：同一提交重跑（重试、再 dispatch、改文件名）得到同一个号，天然幂等，
      # 不再需要「重试复用第一次的号」这套缓存。
      - name: 算版本 yy.m.d.当日序号.总序号
        run: |
          set -euo pipefail
          # 硬前提：完整历史。浅克隆下 git rev-list --count HEAD 恒为 1，产物会全叫 .1.1。
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "浅克隆：actions/checkout 少了 fetch-depth: 0，提交数不可信" >&2
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          since="$(TZ=Asia/Shanghai date +%F)T00:00:00+08:00"
          if ! total="$(git rev-list --count HEAD)"; then echo "取不到总序号" >&2; exit 1; fi
          if ! daily="$(git rev-list --count --since="$since" HEAD)"; then echo "取不到当日序号" >&2; exit 1; fi
          [ -n "$total" ] && [ -n "$daily" ] || { echo "取号为空：total=$total daily=$daily" >&2; exit 1; }
          case "$total$daily" in *[!0-9]*) echo "取号含非数字：total=$total daily=$daily" >&2; exit 1;; esac
          [ "$total" -ge 1 ] || { echo "总序号小于 1：$total" >&2; exit 1; }
          # head 提交不在当日（UTC+8）时当日序号就是 0（重出旧提交的包），不写 1 冒充当日首包。
          day="$(TZ=Asia/Shanghai date +%y.%-m.%-d)"
          version="$day.$daily.$total"
          echo "取号启动行：head=$head_sha 总序号=$total 当日序号=$daily 日期段=$day 版本=$version"
          echo "取号命令原文：git rev-list --count HEAD ／ git rev-list --count --since=\"$since\" HEAD"
          printf '%s' "$version" | grep -Eq '^[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$' \
            || { echo "版本不是五段 yy.m.d.当日序号.总序号：$version" >&2; exit 1; }
          echo "QSELF_VERSION=$version" >> "$GITHUB_ENV"

      - name: 测试与出包
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Check libxposed packaging
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name 'Qself-*.apk' -print -quit)
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ env.QSELF_VERSION }}
          path: app/build/outputs/apk/debug/Qself-${{ env.QSELF_VERSION }}.apk
          if-no-files-found: error
          # 同一提交重出包同号；同名 artifact 覆盖，清理按创建时间删旧留新。
          overwrite: true
          retention-days: 5

  # artifact 与运行记录清理：命名、来源、重复当日序号、号源口径、数量五条，全部无日期豁免。
  # artifact 全仓按 created_at 留 5 个；每工作流运行按 run_started_at 留 5 条，超限未完成运行先取消。
  # 真删两个调用点都真删（本处 + PR 校验工作流的清理作业，两处同一 concurrency group）；PR 校验序列的超量 run 在这里也按序列一并收（actions: write 可删同仓任意工作流的 run）。
  # 权限最小 actions: write（只删本项目 artifact 与 run），按规范不与 contents: write 同授；动不到 Release、tag、分支。
  cleanup-artifacts:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: qself-cleanup-artifacts
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      # 清理脚本启动要打印两条取号命令的输出：浅克隆下会打出 1，所以这里也要完整历史。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 按五条判据清理 artifact 与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: python3 .github/scripts/cleanup.py

  # Release / tag 清理：动的是发行对象，要 contents: write，所以单独作业、只在默认分支上动，
  # 与上面那个 actions: write 的作业分开授权（规范禁止两者同授）。
  # 这条 if 只拦「在会话分支上动发行对象」，不砍出包验证 —— 出包与上传在 apk 作业，与本作业无关。
  cleanup-releases:
    needs: apk
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: qself-cleanup-releases
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 项目 Release 只留最近 1 个
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime

          REPO = os.environ["REPO"]
          PREFIX = "Qself-"
          KEEP = 1

          def gh(*args, check=True):
              p = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and p.returncode != 0:
                  raise SystemExit("gh " + " ".join(args) + " 失败：" + p.stderr.strip())
              return p.stdout

          def at(obj):
              return datetime.fromisoformat(obj["created_at"].replace("Z", "+00:00"))

          out = gh("api", "--paginate", f"repos/{REPO}/releases?per_page=100", "--jq", ".[]")
          rels = [json.loads(l) for l in out.splitlines() if l.strip()]
          rels = sorted([r for r in rels if r["tag_name"].startswith(PREFIX)], key=at, reverse=True)
          keep, drop = rels[:KEEP], rels[KEEP:]
          kept_tags = {r["tag_name"] for r in keep}
          print("Release 保留清单：", [r["tag_name"] for r in keep] or "（无）")
          print("Release 删除清单：", [r["tag_name"] for r in drop] or "（无）")
          for r in drop:
              gh("api", "-X", "DELETE", f"repos/{REPO}/releases/{r['id']}")
              print(f"已删 Release {r['tag_name']}")
          for r in drop:
              tag = r["tag_name"]
              if tag in kept_tags:
                  continue
              p = subprocess.run(["gh", "api", f"repos/{REPO}/git/ref/tags/{tag}"], capture_output=True, text=True)
              if p.returncode != 0:
                  if "Not Found" in p.stderr:
                      print(f"tag {tag} 已不存在，跳过")
                      continue
                  raise SystemExit(f"查 tag {tag} 失败：{p.stderr.strip()}")
              gh("api", "-X", "DELETE", f"repos/{REPO}/git/ref/tags/{tag}")
              print(f"已删 tag {tag}")
          print(f"本项目 Release 共 {len(rels)} 个，保留 {len(keep)} 个")
          PY
