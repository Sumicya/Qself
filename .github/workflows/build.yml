# Qself 出包工作流 —— 唯一号源。
#
# 触发只允许 push（限定默认分支 main）与 workflow_dispatch；PR 校验在 pr-check.yml，另一条 run_number 序列。
# run_number 在运行创建时就分配，步骤级 if 挡不住吃号 —— 所以要拆文件，不能靠 if（规范 5e2b978）。
# 调试 CI 的推送走会话分支，不触发出包；会话分支要包用 workflow_dispatch。
# dex 作业拿真 QQ 包核每一个落点；apk 作业按五段版本出 debug APK 放进 Artifacts。
# 出包后立刻做数量清理：artifact（5 个）与运行记录（5 条）用最小 actions: write，
# Release（1 个）/ tag 收口要 contents: write，只在默认分支跑。两者分开授权，不同授。
# 版本取数只锚定本次 run：总序号 = 本出包工作流的 run_number 原值（workflow 重建才用 AGENTS.md 里记的基线相减），
# 当日序号 = 当日（UTC+8）本出包工作流的运行序号（按 run_started_at 升序），取不到就退化四段 yy.m.d.总序号；
# 禁止查最新 run / 最新 artifact 或历史成功数。
# CI 不创建 Release、正式发行 tag 或 Release asset；正式发版必须由主人明确授权并人工完成。
name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# 产物命名口径：`Qself-<版本>` 里版本段的段数（五段 = yy.m.d.当日序号.总序号），清理作业按它判口径。
# 退化四段期改 4，并在 AGENTS.md 写明原因。
env:
  SEGMENTS: '5'

jobs:
  # 落点核对：真包在 Sumicya/qqapk（qq.aa..qq.ae 拼起来）。表红了就是这版 QQ 里名字对不上，
  # 出包也是白出 —— 所以这个作业和出包平行跑，谁红都拦得住。
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 拼出真 QQ 包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          cat qq/qq.a* > qq.apk && rm -rf qq
          ls -l qq.apk
      - name: 逐个核落点
        run: python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6

      # 同一个 run 重试时不许重新加号：第一次 attempt 把版本号存进缓存，重试取回。
      - name: 取回第一次 attempt 的版本号
        if: github.run_attempt > 1
        uses: actions/cache/restore@v6
        with:
          path: version.txt
          key: qself-version-${{ github.run_id }}

      - name: 算版本 yy.m.d.当日序号.总序号
        env:
          GH_TOKEN: ${{ github.token }}
          # 本仓 workflow 未重建，无基线：总序号直接取本次 run 的 run_number 原值。
          # 将来重建 workflow 造成号段跳变时，把重建前最大号写进 AGENTS.md 作基线并填到这里相减，此后全部相减，不与原值混用。
          TOTAL_BASE: ''
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if [ -f version.txt ]; then
            version="$(cat version.txt)"
            echo "复用第一次 attempt 的版本：$version"
          else
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
              echo "重试却取不到第一次 attempt 的版本号：那次在算出版本前就失败了。按口径不重新加号，请新开一次运行。" >&2
              exit 1
            fi
            # 只锚定本次 run 自身：created_at、run_number，不查历史。
            created="$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
            my_num="$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID" --jq '.run_number')"
            day="$(TZ=Asia/Shanghai date -d "$created" +%y.%-m.%-d)"
            local_day="$(TZ=Asia/Shanghai date -d "$created" +%Y-%m-%d)"
            total="$((my_num - ${TOTAL_BASE:-0}))"
            if [ "$total" -lt 1 ]; then echo "总序号 $total 不合法" >&2; exit 1; fi
            # 当日序号 = 当日（UTC+8）本出包工作流的运行序号：数本文件的 push / workflow_dispatch 运行，
            # 按 run_started_at 升序排，本次排第几就是几。PR 校验是另一个文件，不在这条序列里。
            # 禁用「head 提交位次」这类并发下会竞态的取数。
            prog="$(cat <<'JQ'
          .workflow_runs[]
          | select(.path == ".github/workflows/build.yml")
          | select(.event == "push" or .event == "workflow_dispatch")
          | [.run_number, (.run_started_at // .created_at), .id] | @tsv
          JQ
          )"
            rank="$(gh api --paginate "repos/$repo/actions/runs?per_page=100" --jq "$prog" \
              | awk -F'\t' -v day="$local_day" \
                  '{ cmd = "TZ=Asia/Shanghai date -d \"" $2 "\" +%Y-%m-%d"; cmd | getline d; close(cmd); if (d == day) print }' \
              | sort -k2,2 -k1,1n \
              | awk -F'\t' -v me="$GITHUB_RUN_ID" '{ i++; if ($3 == me) r = i } END { print r + 0 }')"
            if [ "$rank" -ge 1 ]; then
              version="$day.$rank.$total"
              echo "当日（$local_day）出包运行序号：$rank"
            else
              version="$day.$total"
              echo "退化四段：本次运行不在当日（$local_day）出包运行列表里，当日序号取不到；原因要记进本仓 AGENTS.md。" >&2
            fi
            printf '%s' "$version" > version.txt
          fi
          printf '%s' "$version" | grep -Eq '^[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+){1,2}$' \
            || { echo "版本不是四段或五段：$version" >&2; exit 1; }
          echo "QSELF_VERSION=$version" >> "$GITHUB_ENV"

      - name: 存住版本号（供同 run 重试复用）
        if: github.run_attempt == 1
        uses: actions/cache/save@v6
        with:
          path: version.txt
          key: qself-version-${{ github.run_id }}

      - name: 测试与出包
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Check libxposed packaging
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name 'Qself-*.apk' -print -quit)
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ env.QSELF_VERSION }}
          path: app/build/outputs/apk/debug/Qself-${{ env.QSELF_VERSION }}.apk
          if-no-files-found: error
          # 只有同一个 run 的重试会遇到同名（版本号相同）；换个运行就是另一卷，盖不到别的产物。
          overwrite: true
          retention-days: 5

  # artifact 与运行记录清理：判据三条 —— 数量（当日之外每条序列 artifact 5、run 5）、
  # 命名口径（段数 ≠ 工作流顶部 SEGMENTS）、产物来源（workflow_run 事件是 pull_request 的一律删）。
  # 数量判据当日豁免：当日序号取自当日运行列表，删当日运行会抽走计数基准；口径与来源不豁免，当轮即删。
  # 清理只留这一处：PR 校验工作流不挂清理作业，它的超量 run 在这里按序列一并收。
  # 权限最小 actions: write（只删本项目 artifact 与 run），按规范不与 contents: write 同授；动不到 Release、tag、分支。
  cleanup-artifacts:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: qself-cleanup-artifacts
      cancel-in-progress: false
    permissions:
      actions: write
    steps:
      - name: 按三条判据清理 artifact 与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone

          REPO = os.environ["REPO"]
          SELF = int(os.environ["SELF"])
          SEGMENTS = int(os.environ["SEGMENTS"])       # 工作流顶部声明
          PREFIX = "Qself-"
          KEEP = 5                                     # 当日之外每条序列 artifact 5、run 5
          CST = timezone(timedelta(hours=8))
          today = datetime.now(CST).strftime("%Y-%m-%d")

          def gh(*args, check=True):
              p = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and p.returncode != 0:
                  raise SystemExit("gh " + " ".join(args) + " 失败：" + p.stderr.strip())
              return p.stdout

          def list_all(url, key):
              out = gh("api", "--paginate", url, "--jq", key + "[]")
              return [json.loads(line) for line in out.splitlines() if line.strip()]

          def day_of(obj):
              return datetime.fromisoformat(obj["created_at"].replace("Z", "+00:00")).astimezone(CST).strftime("%Y-%m-%d")

          runs = list_all(f"repos/{REPO}/actions/runs?per_page=100", ".workflow_runs")
          by_id = {r["id"]: r for r in runs}

          # ---------- artifact：口径 → 来源 → 数量 ----------
          arts = [a for a in list_all(f"repos/{REPO}/actions/artifacts?per_page=100", ".artifacts") if not a["expired"]]
          drop_a, keep_a = [], []
          quota = defaultdict(list)                    # 序列（工作流路径）-> 当日之外待选，按时间新到旧
          for a in sorted(arts, key=lambda x: x["created_at"], reverse=True):
              r = by_id.get(a["workflow_run"]["id"])
              seq = (r or {}).get("path", "(未知来源)")
              name = a["name"]
              seg = len(name[len(PREFIX):].split(".")) if name.startswith(PREFIX) else 0
              if not name.startswith(PREFIX) or seg != SEGMENTS:
                  drop_a.append((a, seq, f"口径：段数 {seg} ≠ {SEGMENTS}"))
              elif r and r["event"] == "pull_request":
                  drop_a.append((a, seq, "来源：workflow_run 事件是 pull_request"))
              elif day_of(a) == today:
                  keep_a.append((a, seq, "当日豁免"))
              else:
                  quota[seq].append(a)

          for seq, lst in quota.items():
              for i, a in enumerate(lst):
                  if i < KEEP:
                      keep_a.append((a, seq, "数量：当日之外保 5"))
                  else:
                      drop_a.append((a, seq, "数量：超出当日之外上限"))

          print(f"artifact：删除 {len(drop_a)} 个，保留 {len(keep_a)} 个（当日豁免 {sum(1 for _, _, why in keep_a if why == '当日豁免')} 个）")
          for a, seq, why in drop_a:
              print(f"  删 {a['name']} id={a['id']}（{why}）")
              gh("api", "-X", "DELETE", f"repos/{REPO}/actions/artifacts/{a['id']}")
          kept_runs = {a["workflow_run"]["id"] for a, _, _ in keep_a}
          left = defaultdict(int)
          for a, seq, _ in keep_a:
              left[seq] += 1
          for seq in sorted(left):
              print(f"  剩 {seq}  {left[seq]} 个")

          # ---------- 运行记录：数量（序列按工作流计），当日豁免；承载保留产物的 run 不动 ----------
          drop_r, keep_r = [], []
          seq_runs = defaultdict(list)
          for r in sorted(runs, key=lambda x: x["id"], reverse=True):
              if r["id"] == SELF or r["status"] != "completed" or day_of(r) == today:
                  continue
              seq_runs[r["path"]].append(r)
          for seq, lst in seq_runs.items():
              for i, r in enumerate(lst):
                  # 当日之外每条序列保 5 条；承载保留产物的 run 一律不动（删 run 会连带删产物）
                  if i < KEEP or r["id"] in kept_runs:
                      keep_r.append((r, seq))
                  else:
                      drop_r.append((r, seq))

          print(f"运行记录：删除 {len(drop_r)} 条（全部为当日之外、且不承载保留产物）")
          for r, seq in drop_r:
              print(f"  删 id={r['id']} rn={r['run_number']} {seq} {r['created_at']}")
              gh("api", "-X", "DELETE", f"repos/{REPO}/actions/runs/{r['id']}")
          deleted = {r["id"] for r, _ in drop_r}
          left_r = defaultdict(int)
          for r in runs:
              if r["id"] not in deleted:
                  left_r[r["path"]] += 1
          for seq in sorted(left_r):
              print(f"  剩 {seq}  {left_r[seq]} 条")
          PY

  # Release / tag 清理：动的是发行对象，要 contents: write，所以单独作业、只在默认分支上跑，
  # 与上面那个 actions: write 的作业分开授权（规范禁止两者同授）。
  cleanup-releases:
    needs: apk
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: qself-cleanup-releases
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 项目 Release 只留最近 1 个
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime

          REPO = os.environ["REPO"]
          PREFIX = "Qself-"
          KEEP = 1

          def gh(*args, check=True):
              p = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and p.returncode != 0:
                  raise SystemExit("gh " + " ".join(args) + " 失败：" + p.stderr.strip())
              return p.stdout

          def at(obj):
              return datetime.fromisoformat(obj["created_at"].replace("Z", "+00:00"))

          out = gh("api", "--paginate", f"repos/{REPO}/releases?per_page=100", "--jq", ".[]")
          rels = [json.loads(l) for l in out.splitlines() if l.strip()]
          rels = sorted([r for r in rels if r["tag_name"].startswith(PREFIX)], key=at, reverse=True)
          keep, drop = rels[:KEEP], rels[KEEP:]
          kept_tags = {r["tag_name"] for r in keep}
          print("Release 保留清单：", [r["tag_name"] for r in keep] or "（无）")
          print("Release 删除清单：", [r["tag_name"] for r in drop] or "（无）")
          for r in drop:
              gh("api", "-X", "DELETE", f"repos/{REPO}/releases/{r['id']}")
              print(f"已删 Release {r['tag_name']}")
          for r in drop:
              tag = r["tag_name"]
              if tag in kept_tags:
                  continue
              p = subprocess.run(["gh", "api", f"repos/{REPO}/git/ref/tags/{tag}"], capture_output=True, text=True)
              if p.returncode != 0:
                  if "Not Found" in p.stderr:
                      print(f"tag {tag} 已不存在，跳过")
                      continue
                  raise SystemExit(f"查 tag {tag} 失败：{p.stderr.strip()}")
              gh("api", "-X", "DELETE", f"repos/{REPO}/git/ref/tags/{tag}")
              print(f"已删 tag {tag}")
          print(f"本项目 Release 共 {len(rels)} 个，保留 {len(keep)} 个")
          PY
