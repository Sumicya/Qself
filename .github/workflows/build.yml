# Qself CI。
#
# 每次 push / PR / 手动运行：dex 作业拿真 QQ 包核每一个落点；apk 作业跑 ProtoTest 再出 debug APK 放进 Artifacts。
# CI 不创建 Release、正式发行 tag 或 Release asset；正式发版必须按仓库规范由主人明确授权并人工完成。
# 出包成功后自动清：按 Qself- 前缀（不区分大小写）及已核实的历史产物名保留最近 5 个；PR 不跑清理（写权限不进未信任代码）。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 拼出真 QQ 包
        run: |
          git clone -q --depth 1 https://github.com/Sumicya/qqapk qq
          cat qq/qq.a* > qq.apk && rm -rf qq
          ls -l qq.apk
      - name: 逐个核落点
        run: python3 tools/dexcheck.py --apk qq.apk --lint app/src/main/kotlin --quiet

  apk:
    needs: dex
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Calculate release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
          day="$(TZ=Asia/Shanghai date -d "$stamp" +%y.%-m.%-d)"
          local_day="$(TZ=Asia/Shanghai date -d "$stamp" +%Y-%m-%d)"
          since="$(TZ=Asia/Shanghai date -u -d "$local_day 00:00:00" +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            push_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=push&created=>=$since&per_page=1" --jq '.total_count')"
            dispatch_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=workflow_dispatch&created=>=$since&per_page=1" --jq '.total_count')"
            total_push="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=push&per_page=1" --jq '.total_count')"
            total_dispatch="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=workflow_dispatch&per_page=1" --jq '.total_count')"
            daily="$((push_runs + dispatch_runs))"
            total="$((total_push + total_dispatch))"
          else
            daily=0
            total=0
          fi
          echo "QSELF_DAILY_SEQUENCE=$daily" >> "$GITHUB_ENV"
          echo "QSELF_VERSION=$day.$daily.$total" >> "$GITHUB_ENV"

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Check libxposed packaging
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name 'Qself-*.apk' -print -quit)
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ env.QSELF_VERSION }}
          path: app/build/outputs/apk/debug/Qself-${{ env.QSELF_VERSION }}.apk
          if-no-files-found: error
          retention-days: 5

  cleanup_artifacts:
    name: 清理 Qself 历史 artifact
    if: ${{ github.event_name != 'pull_request' }}
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: qself-artifact-retention
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - name: 列出并清理 Qself 历史 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "5"
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          raw_keep = os.environ.get("KEEP", "")
          if not raw_keep.isdecimal() or int(raw_keep) < 1:
              sys.exit("KEEP 必须为正整数")
          keep = int(raw_keep)
          repo = os.environ["REPO"]
          def api(path, jq=None, method=None):
              cmd = ["gh", "api"] + (["--jq", jq] if jq else []) + (["-X", method] if method else []) + [path]
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode:
                  sys.exit(f"gh api {path} 失败: {r.stderr.strip()}")
              return r.stdout
          rows, page = [], 1
          while True:
              batch = [json.loads(line) for line in
                       api(f"repos/{repo}/actions/artifacts?per_page=100&page={page}",
                           jq=".artifacts[]|{id,name,created_at}").splitlines() if line.strip()]
              if not batch:
                  break
              rows += batch
              page += 1
          # qself-debug matches the case-insensitive Qself- prefix. These legacy names
          # were verified as Qself artifacts from former build/test workflows.
          legacy_names = {"app-debug", "build-log", "test-reports"}
          owned = [r for r in rows if r["name"].casefold().startswith("qself-") or r["name"].casefold() in legacy_names]
          owned.sort(key=lambda r: (r["created_at"], r["id"]), reverse=True)
          keep_rows, delete_rows = owned[:keep], owned[keep:]
          print(f"Qself artifact {len(owned)} 个；保留 {len(keep_rows)} 个；其他 artifact {len(rows)-len(owned)} 个不在清理范围。", flush=True)
          print("完整清理清单（以下清单全部输出后才开始删除）：", flush=True)
          for r in keep_rows:
              print(f"KEEP   {r['created_at']} {r['name']} id={r['id']}", flush=True)
          for r in delete_rows:
              print(f"DELETE {r['created_at']} {r['name']} id={r['id']}", flush=True)
          if not delete_rows:
              print("无待删除 artifact", flush=True)
          sys.stdout.flush()
          for r in delete_rows:
              api(f"repos/{repo}/actions/artifacts/{r['id']}", method="DELETE")
              print(f"DELETED {r['created_at']} {r['name']} id={r['id']}", flush=True)
          print(f"清理完成：删除 {len(delete_rows)} 个 Qself artifact；未触碰 Release/tag。", flush=True)
          PY
