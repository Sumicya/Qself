name: spec-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check global specification
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          agents = root / "AGENTS.md"
          if not agents.exists():
              raise SystemExit("缺少 AGENTS.md")
          text = agents.read_text(encoding="utf-8")
          required = [
              "本仓库上次同步 = 第十七版",
              "规范指针",
              "Sumicya/selfs",
              "GLOBAL.md",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f"AGENTS.md 缺少规范版本或指针：{item}")

          workflows = root / ".github" / "workflows"
          build = (workflows / "build.yml").read_text(encoding="utf-8")
          if "cleanup_artifacts" not in build or 'KEEP: "5"' not in build:
              raise SystemExit("build.yml 缺少保留最近 5 个发行 artifact 的 cleanup_artifacts")

          forbidden = re.compile(
              r"(?i)(softprops/action-gh-release|actions/create-release|actions/upload-release-asset|"
              r"gh\s+release\s+(?:create|upload)|create_git_release|createRelease)"
          )
          stale = re.compile(
              r"(?i)(actions/checkout@v[1-4]\b|actions/setup-java@v[1-3]\b|"
              r"actions/setup-python@v[1-4]\b|actions/upload-artifact@v[1-3]\b|"
              r"runs-on:\s*ubuntu-latest\b)"
          )
          write_perm = re.compile(
              r"(?im)^\s*(contents|actions|packages|pull-requests|checks|statuses|id-token):\s*write\b"
          )
          for path in workflows.glob("*.yml"):
              source = path.read_text(encoding="utf-8")
              if path.name != "spec-check.yml" and forbidden.search(source):
                  raise SystemExit(f"{path} 含自动发版实现")
              m = stale.search(source)
              if m:
                  raise SystemExit(f"{path} 含禁旧条件（{m.group(0)}）")
              if path.name == "build.yml":
                  # 仅 cleanup job 可有 actions: write；顶层须为 read
                  if re.search(r"(?im)^permissions:\s*write-all\b", source):
                      raise SystemExit("build.yml 不得 write-all")
              elif write_perm.search(source) or re.search(r"(?im)^\s*permissions:\s*write-all\b", source):
                  raise SystemExit(f"{path} 不得有写权限")
          print("第十七版规范检查通过（含禁旧扫描与 artifact 保留 5）")
