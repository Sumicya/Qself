name: Unit Test CI

on:
  push:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'renovate.json'
      - '.editorconfig'
      - '.gitignore'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    name: Unit Test (JVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          fetch-depth: 1

      - name: Config submodules
        run: |
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsprism.update" none
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsparself.update" none
          git -C "libs/LSPlant" config "submodule.docs/doxygen-awesome-css.update" none
          git -C "libs/mmkv/MMKV" config "submodule.Python/pybind11.update" none
          git submodule foreach git submodule update --init --recursive

      - name: set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          mkdir -p "$ANDROID_HOME/licenses/"
          echo > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -n 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-test-output.log

      - name: Surface test failures as annotations
        if: failure()
        run: |
          # gradle test failures live in XML reports; mirror them into the
          # check-run annotations so they are visible via the REST API.
          # when gradle failed without test results, chunk the build log
          # tail into annotations as well (location-less errors have no
          # native annotations).
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          found = False
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      found = True
                      print('::error title=Test failed::{}.{}'.format(
                          tc.get('classname'), tc.get('name')))
                      node = tc.find('failure')
                      if node is None:
                          node = tc.find('error')
                      msg = (node.get('message') or '').replace('\n', ' ')[:300]
                      print('::error title=Detail::{}'.format(msg))
          if not found:
              print('::error title=No test XML found::gradle failed before/without test results')
              try:
                  lines = open('gradle-test-output.log', errors='replace').read().splitlines()
              except OSError:
                  lines = []
              import re
              # priority: compiler/tool error lines; never pure stack frames
              hits = [l for l in lines if re.search(
                  r'e: file:|error:|FAILED|What went wrong|Unresolved|cannot find|Caused by', l)]
              if not hits:
                  hits = [l for l in lines[-400:] if l.strip() and not l.lstrip().startswith('at ')]
              for i, l in enumerate(hits[-40:]):
                  print('::error title=Build error {}::{}'.format(i + 1, l[:700]))
          PY
          echo '---- raw failure snippets ----'
          grep -rA6 -E '<failure|<error' app/build/test-results/testDebugUnitTest 2>/dev/null | head -80 || true

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
