# Qself
#
# AGP 9 properties. builtInKotlin replaces the standalone kotlin-android
# plugin; disallowKotlinSourceSets blocks the (removed) KGP source-set DSL.
#
# SPDX-License-Identifier: GPL-3.0-or-later

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 defaults to the new DSL; the old one is still what this project's
# build scripts (and the proven pre-rewrite setup) use.
android.newDsl=false
android.builtInKotlin=true
android.disallowKotlinSourceSets=true
android.enableBuildConfigAsBytecode=true
android.includeDependencyInfoInApks=false

kotlin.code.style=official
