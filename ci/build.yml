# Qself CI. 这个文件必须放在 .github/workflows/build.yml：
#
#   cp ci/build.yml .github/workflows/build.yml
#   git add .github/workflows/build.yml && git commit -m "ci: log failures" && git push
#
# 之后每次 push 都会构建：APK 在 Actions 的 Artifacts 里，也覆盖到固定链接
#   https://github.com/Sumicya/Qself/releases/download/ci/Qself-debug.apk
# 上（浏览器点一下就直接下载）；构建失败时把 Gradle 日志的尾巴贴成本次提交的 comment。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run ./gradlew --no-daemon :app:assembleDebug
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee build.log
      - name: Check libxposed packaging
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          for f in java_init.list module.prop scope.list; do unzip -l "$APK" | grep -F "META-INF/xposed/$f"; done
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then echo 'legacy entry packaged' >&2; exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: Qself-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish the rolling CI release
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Qself-debug.apk
          gh release view ci >/dev/null 2>&1 || gh release create ci --prerelease --title "CI build" --notes "每次 push 覆盖这个附件" --target "$GITHUB_SHA"
          gh release upload ci Qself-debug.apk --clobber
      - name: Publish the build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "failed before gradle" > build.log
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(tail -c 6000 build.log)"
