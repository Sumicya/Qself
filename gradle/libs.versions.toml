kotlin = "2.4.10"

agp = "9.3.1"

# proven pairing from the upstream build (Kotlin 2.4.10)
ksp = "2.3.11"

# --- AndroidX / UI -----------------------------------------------------------
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.10.0" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.9.1" }
androidx-activity = { module = "androidx.activity:activity-ktx", version = "1.13.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.0" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
androidx-preference = { module = "androidx.preference:preference-ktx", version = "1.3.0" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.11.0" }
material = { module = "com.google.android.material:material", version = "1.14.0" }

# --- Kotlin ecosystem --------------------------------------------------------
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.11.0" }

# --- Xposed ------------------------------------------------------------------
xposed-api = { module = "de.robv.android.xposed:api", version = "89" }

# --- KSP tooling -------------------------------------------------------------
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
