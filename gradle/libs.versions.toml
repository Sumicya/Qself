# Qself — dependency catalog.
#
# Kotlin/KSP are version-coupled with AGP 9's built-in Kotlin support; the
# pair below is the one that builds green on this repo's stack (AGP 9.3.1).
#
# SPDX-License-Identifier: GPL-3.0-or-later

[versions]
kotlin = "2.4.20"
agp = "9.3.1"
# KSP 2.x (KSP2) — must match the Kotlin version AGP compiles with
ksp = "2.3.12"

[libraries]
# --- AndroidX ----------------------------------------------------------------
# The only AndroidX entry left, and it is build-only: the vendored libxposed
# 10.x API stubs (libs/libxposed/api) annotate their Java sources with it.
# The app itself ships framework-only UI.
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.10.0" }

# --- Xposed ------------------------------------------------------------------
# classic Xposed API; compileOnly (the framework provides it at runtime).
# 82 is the newest version published on api.xposed.info.
xposed-api = { module = "de.robv.android.xposed:api", version = "82" }

# --- KSP tooling -------------------------------------------------------------
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
