# Qself — dependency catalog.
#
# Versions mirror the combination that is known to build with AGP 9.3.1 /
# Kotlin 2.4.10 (see git history of this repo for the pre-rewrite setup).
#
# SPDX-License-Identifier: GPL-3.0-or-later

kotlin = "2.4.20"

agp = "9.3.1"

# KSP 2.x (KSP2) — works with AGP 9 built-in Kotlin
ksp = "2.3.12"

# --- AndroidX / UI -----------------------------------------------------------
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.10.0" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.0" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
material = { module = "com.google.android.material:material", version = "1.14.0" }

# --- Xposed ------------------------------------------------------------------
# classic Xposed API; compileOnly (the framework provides it at runtime).
# 82 is the newest version published on api.xposed.info (there is no 89).
xposed-api = { module = "de.robv.android.xposed:api", version = "82" }

# --- KSP tooling -------------------------------------------------------------
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
