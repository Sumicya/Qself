name: Qself CI

on:
  push:
  pull_request:

concurrency:
  group: qself-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Config submodules
        run: |
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsprism.update" none
          git -C "libs/LSPlant" config "submodule.test/src/main/jni/external/lsparself.update" none
          git -C "libs/LSPlant" config "submodule.docs/doxygen-awesome-css.update" none
          git submodule foreach git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses/"
          echo -n 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          # LSPlant requires NDK r29+ and CMake 3.28+
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13599879" "cmake;3.31.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Report toolchain
        run: |
          NDK=$(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ',')
          CMAKE=$(ls "$ANDROID_HOME/cmake" 2>/dev/null | tr '\n' ',')
          PLATFORMS=$(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ',')
          echo "ndk=[$NDK] cmake=[$CMAKE] platforms=[$PLATFORMS]"
          echo "::notice title=toolchain::ndk=$NDK cmake=$CMAKE platforms=$PLATFORMS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The sandbox that maintains this repo cannot download job logs
      # (results-receiver.actions.githubusercontent.com is unreachable), so a
      # failing build reports itself through check-run annotations, which the
      # API serves.
      - name: Build
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --console=plain > build.log 2>&1
          code=$?
          set -e
          echo "gradle exit code: $code"
          tail -n 60 build.log || true
          if [ "$code" -ne 0 ]; then
            python3 - <<'PY'
          import os
          path = 'build.log'
          data = open(path, errors='replace').read() if os.path.exists(path) else '(no build.log)'
          keys = ('error:', 'e: ', 'FAILURE', 'FAILED', 'What went wrong', 'Caused by',
                  'Could not', 'Unresolved reference', 'not found', 'Exception', 'Unable to')
          picked, seen = [], set()
          for line in data.splitlines():
              if any(k in line for k in keys) and line not in seen:
                  seen.add(line)
                  picked.append(line)
          def emit(title, text):
              text = text.replace('%', '%25').replace('\r', '')
              if not text.strip():
                  text = '(empty)'
              blocks = [text[i:i + 2800] for i in range(0, len(text), 2800)]
              for i, block in enumerate(blocks):
                  print("::error title=%s %d/%d::%s" % (title, i + 1, len(blocks), block.replace('\n', '%0A')))
          emit('gradle-errors', '\n'.join(picked[:120]))
          emit('gradle-tail', data[-14000:])
          PY
          fi
          exit "$code"

      # The modern (libxposed) module contract is a set of files inside the
      # APK; a wrong path here means "module installs but never loads", which
      # no compiler would catch. Report the result as annotations so it can be
      # inspected without downloading the artifact.
      - name: Verify APK
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "apk: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" > apk-contents.txt
          fail=0
          report=""
          for entry in META-INF/xposed/module.prop META-INF/xposed/java_init.list \
                       META-INF/xposed/scope.list lib/arm64-v8a/libqself_hook.so \
                       lib/armeabi-v7a/libqself_hook.so; do
            if grep -q " ${entry}$" apk-contents.txt; then
              report="${report}OK ${entry}%0A"
            else
              report="${report}MISSING ${entry}%0A"
              fail=1
            fi
          done
          ENTRY=$(head -n1 META-INF/xposed/java_init.list 2>/dev/null || echo "sumicya.qself.QselfModule10x")
          if unzip -p "$APK" classes.dex | grep -aq "L${ENTRY//.//};"; then
            report="${report}OK entry class in dex%0A"
          else
            report="${report}MISSING entry class in dex%0A"
          fi
          echo -e "$report"
          echo "::notice title=apk-contents::$(stat -c%s "$APK") bytes%0A${report}"
          echo "::notice title=module.prop::$(sed -e 's/$/%0A/' tools/moduleprop/src/main/resources/META-INF/xposed/module.prop)"
          if [ "$fail" -ne 0 ]; then
            echo "::error title=apk-contents::module metadata missing from the APK"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qself-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
