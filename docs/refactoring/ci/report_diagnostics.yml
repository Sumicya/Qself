name: Report diagnostics metadata tests

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'app/src/main/java/sumicya/qself/diagnostics/**'
      - 'app/src/test/java/sumicya/qself/diagnostics/**'
      - 'scripts/test-report-diagnostics.sh'
      - 'scripts/test_report_diagnostics_contract.py'
      - '.github/workflows/report_diagnostics.yml'
  pull_request:
    paths:
      - 'app/src/main/java/sumicya/qself/diagnostics/**'
      - 'app/src/test/java/sumicya/qself/diagnostics/**'
      - 'scripts/test-report-diagnostics.sh'
      - 'scripts/test_report_diagnostics_contract.py'
      - '.github/workflows/report_diagnostics.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure JVM tests and static read-only guardrails (not an APK build)
        run: scripts/test-report-diagnostics.sh
